# Generated from deployment.json; include once in the http context.
# Bound peak in-memory request buffering to eight concurrent API requests.
limit_conn_zone $server_name zone=inscription_api_connections:64k;
map $http_origin $inscription_origin_ok {
    default 0;
    "" 1;
    "https://www.musicxlab.com" 1;
}
map $http_origin $inscription_upstream_origin {
    "" "";
    default "https://inscription-beta.robin-y.workers.dev";
}
# Stock Nginx cannot rename individual Set-Cookie lines, so the browser keeps
# the Worker's cookie names; proxy_cookie_path confines them to the experiment
# and only these names are forwarded. The pre-archive lab cookie is forwarded
# while no paper1_session exists, and every API response expires it.
map $cookie_inscription_lab_94b4a2474a $inscription_cookie_legacy {
    "" "";
    default "paper1_session=$cookie_inscription_lab_94b4a2474a; ";
}
map $cookie_inscription_lab_94b4a2474a $inscription_cookie_legacy_clear {
    "" "";
    default "inscription_lab_94b4a2474a=; Path=/inscription-system/; Max-Age=0; HttpOnly; Secure; SameSite=Lax";
}
map $cookie_paper1_session $inscription_cookie_session {
    "" $inscription_cookie_legacy;
    default "paper1_session=$cookie_paper1_session; ";
}
map $cookie_paper1_session_archive_1 $inscription_cookie_archive_1 {
    "" "";
    default "paper1_session_archive_1=$cookie_paper1_session_archive_1; ";
}
map $cookie_paper1_session_archive_2 $inscription_cookie_archive_2 {
    "" "";
    default "paper1_session_archive_2=$cookie_paper1_session_archive_2; ";
}
map $cookie_paper1_session_archive_3 $inscription_cookie_archive_3 {
    "" "";
    default "paper1_session_archive_3=$cookie_paper1_session_archive_3; ";
}
map $cookie_paper1_active_archive $inscription_cookie_active_archive {
    "" "";
    default "paper1_active_archive=$cookie_paper1_active_archive; ";
}
map "$inscription_cookie_session$inscription_cookie_archive_1$inscription_cookie_archive_2$inscription_cookie_archive_3$inscription_cookie_active_archive" $inscription_upstream_cookie {
    default "";
    "~^(?<inscription_cookie_list>.+); $" $inscription_cookie_list;
}
map $request_uri $inscription_worker_uri {
    default "";
    "~^/inscription-system(?<inscription_api_suffix>/api/.*)$" $inscription_api_suffix;
}
map "$uri|$arg_v" $inscription_static_cache {
    default "no-cache";
    "~^/inscription-system/assets/" "public, max-age=31536000, immutable";
    "~^/inscription-system/study-data/[^|]*\|[a-f0-9]{12,64}$" "public, max-age=31536000, immutable";
}
# API redirects are only allowed back into the experiment. Unexpected relative
# or external redirects fail closed instead of leaving the study origin.
map $upstream_http_location $inscription_redirect_target {
    default "";
    "~^https://inscription-beta\.robin-y\.workers\.dev(?<inscription_absolute_path>/.*)$" "/inscription-system$inscription_absolute_path";
    "~^/(?<inscription_root_path>[^/].*)$" "/inscription-system/$inscription_root_path";
}
